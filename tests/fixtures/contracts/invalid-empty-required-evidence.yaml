# requiredEvidence must contain at least one item.
apiVersion: qualitymesh.dev/v1
kind: ReleaseContract
metadata:
  name: minimal-release
  version: 1
trustBoundary:
  repository: qualitymesh/example
  defaultBranch: main
  trustedWorkflows:
    - id: build-release
      path: .github/workflows/build-release.yml
      allowedRefs:
        - refs/heads/main
      allowedEvents:
        - push
requiredEvidence: []
policyRules:
  artifactMismatch: BLOCK
  untrustedWorkflow: BLOCK
  invalidAttestation: BLOCK
  missingRequiredEvidence: INSUFFICIENT_EVIDENCE
  failedCriticalJourney: BLOCK
  exposedSecrets:
    maximum: 0
    outcome: BLOCK
  criticalVulnerabilities:
    maximum: 0
    outcome: BLOCK
